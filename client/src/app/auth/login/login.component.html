<div class="auth-wrapper">
  <div class="auth-card">

    <!-- LEFT SIDE -->
    <div class="left-side">

      <h2>Welcome Back 👋</h2>
      <p class="subtitle">Login to continue</p>

      <!-- 🔄 MODE SWITCH -->
      <div class="mode-toggle">
        <button
          [class.active]="loginMode === 'password'"
          (click)="loginMode='password'">
          🔑 Password
        </button>

        <button
          [class.active]="loginMode === 'otp'"
          (click)="loginMode='otp'">
          📱 OTP
        </button>
      </div>

      <!-- ❗ ERROR -->
      <div class="error-message" *ngIf="errorMessage">
        {{ errorMessage }}
      </div>

      <!-- ========================== -->
      <!-- 🔐 PASSWORD LOGIN -->
      <!-- ========================== -->
      <form *ngIf="loginMode==='password'"
            [formGroup]="loginForm"
            (ngSubmit)="onLogin()">

        <div class="form-group">
          <label>Username</label>
          <input type="text" formControlName="username" placeholder="Enter username"/>
        </div>

        <div class="form-group password-wrapper">
          <label>Password</label>
          <input
            [type]="showPassword ? 'text' : 'password'"
            formControlName="password"
            placeholder="Enter password"/>
          <span (click)="showPassword = !showPassword">
            {{ showPassword ? 'Hide' : 'Show' }}
          </span>
        </div>

        <button type="submit" [disabled]="isLoading">
          {{ isLoading ? 'Logging in...' : 'Login' }}
        </button>
      </form>

      <!-- ========================== -->
      <!-- 📱 OTP LOGIN -->
      <!-- ========================== -->
      <form *ngIf="loginMode==='otp'" [formGroup]="otpForm">

        <!-- Username -->
        <div class="form-group">
          <label>Username</label>
          <input
            type="text"
            formControlName="username"
            [readonly]="otpSent"
            placeholder="Enter username"/>
        </div>

        <!-- SEND OTP -->
        <button
          *ngIf="!otpSent"
          type="button"
          class="otp-btn"
          (click)="sendOtp()">
          {{ otpSending ? 'Sending OTP...' : 'Send OTP' }}
        </button>

        <!-- OTP INPUT -->
        <div *ngIf="otpSent" class="otp-section">

          <div class="form-group">
            <label>Enter OTP</label>
            <input
              type="text"
              formControlName="otp"
              maxlength="6"
              placeholder="------"
              class="otp-input"/>
          </div>

          <!-- Timer -->
          <div class="otp-meta">
            <span *ngIf="otpTimer > 0">
              ⏱ {{ otpTimer }}s
            </span>
            <span *ngIf="otpTimer === 0" class="expired">
              OTP expired
            </span>
          </div>

          <button type="button" (click)="verifyOtp()">
            ✅ Verify & Login
          </button>

          <button type="button"
                  class="resend"
                  (click)="sendOtp()">
            Resend OTP
          </button>

        </div>

      </form>

      <!-- REGISTER LINK -->
      <div class="register-link">
        <span>Don’t have an account?</span>
        <a routerLink="/register">Register</a>
      </div>

    </div>

    <!-- RIGHT SIDE -->
    <div class="right-side">
      <div class="overlay-shape"></div>
    </div>

  </div>
</div>
