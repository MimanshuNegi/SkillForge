<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0f4ff, #e8eaf6); padding: 40px 20px;">

  <div style="background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 500px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-top: 4px solid #6366f1;">

    <!-- Title -->
    <h2 style="text-align: center; font-weight: 700; color: #1e293b; margin-bottom: 8px; font-size: 1.5rem;">
      📝 Freelancer Registration
    </h2>
    <p style="text-align: center; color: #64748b; margin-bottom: 28px; font-size: 0.9rem;">
      Create your account and get started
    </p>

    <!-- ✅ Success Message -->
    <div *ngIf="successMessage"
         style="background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; padding: 14px 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; font-weight: 600; font-size: 0.95rem;">
      {{ successMessage }}
      <div style="margin-top: 8px;">
        <div style="width: 100%; height: 4px; background: #d1fae5; border-radius: 4px; overflow: hidden;">
          <div style="height: 100%; background: #10b981; border-radius: 4px; animation: progressBar 2s linear forwards;"></div>
        </div>
      </div>
    </div>

    <!-- ✅ Error Message -->
    <div *ngIf="errorMessage"
         style="background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; padding: 14px 16px; border-radius: 12px; text-align: center; margin-bottom: 20px; font-weight: 500; font-size: 0.9rem;">
      {{ errorMessage }}
    </div>

    <!-- Form -->
    <form [formGroup]="freelancerForm" (ngSubmit)="onSubmit()" *ngIf="!successMessage">

      <!-- Username -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          👤 Full Name
        </label>
        <input type="text" formControlName="username" placeholder="Enter your username"
               style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; outline: none;" />
        <small *ngIf="f['username']?.touched && f['username']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 3px; display: block;">
          Username is required
        </small>
      </div>

      <!-- Email -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          📧 Email
        </label>
        <input type="email" formControlName="email" placeholder="Enter your email"
               style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; outline: none;" />
        <small *ngIf="f['email']?.touched && f['email']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 3px; display: block;">
          Valid email is required
        </small>
      </div>

      <!-- Password -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          🔒 Password
        </label>
        <input type="password" formControlName="password" placeholder="Create a password"
               style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; outline: none;" />
        <small *ngIf="f['password']?.touched && f['password']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 3px; display: block;">
          Password is required
        </small>
      </div>

      <!-- Contact Number -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          📞 Contact Number
        </label>
        <input type="text" formControlName="contactNumber" placeholder="Optional"
               style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; outline: none;" />
      </div>

      <!-- Role -->
      <div style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          🏷️ Role
        </label>
        <select formControlName="role"
                style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; cursor: pointer; outline: none;">
          <option value="">Select Role</option>
          <option value="ADMIN">🛡️ ADMIN</option>
          <option value="CLIENT">💼 CLIENT</option>
          <option value="FREELANCER">🛠️ FREELANCER</option>
        </select>
        <small *ngIf="f['role']?.touched && f['role']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 3px; display: block;">
          Role is required
        </small>
      </div>

      <!-- ✅ Skills (FREELANCER only) -->
      <div *ngIf="isFreelancer" style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          🛠️ Skills
        </label>
        <input type="text" formControlName="skills" placeholder="e.g. Angular, Java, Spring Boot"
               style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; outline: none;" />
        <small style="color: #64748b; font-size: 0.75rem; display: block; margin-top: 3px;">
          Separate skills with commas
        </small>
      </div>

      <!-- ✅ Bio (FREELANCER only) -->
      <div *ngIf="isFreelancer" style="margin-bottom: 16px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.85rem;">
          📝 Bio
        </label>
        <textarea formControlName="bio" rows="3" placeholder="Tell us about yourself..."
                  style="width: 100%; padding: 12px 14px; border-radius: 10px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.9rem; box-sizing: border-box; outline: none; resize: vertical;"></textarea>
      </div>

      <!-- Submit Button -->
      <button type="submit"
              [disabled]="freelancerForm.invalid || isLoading"
              style="width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(99,102,241,0.3); transition: 0.3s; letter-spacing: 0.5px;"
              [style.opacity]="freelancerForm.invalid || isLoading ? '0.5' : '1'"
              [style.cursor]="freelancerForm.invalid || isLoading ? 'not-allowed' : 'pointer'">
        {{ isLoading ? '⏳ Registering...' : '🚀 Register' }}
      </button>

    </form>

    <!-- Login Link -->
    <div style="text-align: center; margin-top: 16px; font-size: 0.9rem;" *ngIf="!successMessage">
      <span style="color: #64748b;">Already have an account?</span>
      <a routerLink="/login" style="color: #6366f1; font-weight: 600; text-decoration: none; margin-left: 4px;">
        Login
      </a>
    </div>

  </div>

</div>
