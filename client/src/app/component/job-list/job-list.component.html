<div class="app-wrapper">
  <div class="app-card">

    <!-- Header -->
    <div class="header">
      <h2 class="title">Job List</h2>

      <div class="search-box">
        <input
          type="text"
          placeholder="Search by title..."
          [(ngModel)]="searchTitle"
        />
        <button (click)="searchJobs()">Search</button>
      </div>
    </div>

    <!-- No Jobs -->
    <div *ngIf="job.length === 0" class="empty">
      No jobs found.
    </div>

    <!-- Job Cards -->
    <div *ngFor="let j of job" class="job-card">

      <h4>{{ j.title }}</h4>

      <p>
        {{ j.description ? j.description : 'No description provided' }}
      </p>

      <p>
        <strong>Budget:</strong>
        {{ j.budget ? j.budget : 'Not specified' }}
      </p>

      <!-- Status -->
      <p>
        <strong>Status:</strong>
        <span class="status-badge" [ngClass]="j.status">
          {{ j.status }}
        </span>
      </p>

      <!-- ✅ Apply Button -->
      <button
        class="apply-btn"
        *ngIf="roleName === 'FREELANCER' && j.status === 'OPEN'"
        (click)="applyJob(j.id)"
      >
        Apply
      </button>

      <!-- ✅ Applied Indicator -->
      <span
        class="applied-badge"
        *ngIf="j.status === 'APPLIED'"
      >
        Applied
      </span>

    </div>

  </div>
</div>
