<div class="app-wrapper">
  <div class="app-card">

    <!-- Title -->
    <h2 class="title">✨ Post a New Job</h2>

    <form [formGroup]="jobForm" (ngSubmit)="onSubmit()">

      <!-- Job Title -->
      <div class="form-group">
        <label>Job Title</label>
        <input type="text" formControlName="title" placeholder="e.g. Angular Developer Needed" />
        <small *ngIf="jobForm.controls['title']?.touched && jobForm.controls['title']?.invalid">
          Title is required
        </small>
      </div>

      <!-- Description -->
      <div class="form-group">
        <label>Description</label>
        <textarea rows="4" formControlName="description"
          placeholder="Describe the job requirements, skills needed..."></textarea>
        <small *ngIf="jobForm.controls['description']?.touched && jobForm.controls['description']?.invalid">
          Description is required
        </small>
      </div>

      <!-- Budget -->
      <div class="form-group">
        <label>💰 Budget ($)</label>
        <input type="number" formControlName="budget" placeholder="e.g. 5000" />
        <small *ngIf="jobForm.controls['budget']?.touched && jobForm.controls['budget']?.invalid">
          Budget must be 0 or greater
        </small>
      </div>

      <!-- Status -->
      <div class="form-group">
        <label>📋 Status</label>

        <select formControlName="status" style="background: #1a1a2e; color: #ffffff;">
          <option value="OPEN" style="background: #1a1a2e; color: #ffffff;">🟢 OPEN</option>
          <option value="CLOSED" style="background: #1a1a2e; color: #ffffff;">🔴 CLOSED</option>
        </select>

        <small *ngIf="jobForm.controls['status']?.touched && jobForm.controls['status']?.invalid">
          Status is required
        </small>
      </div>

      <!-- Submit Button -->
      <button type="submit" [disabled]="jobForm.invalid">
        🚀 Create Job
      </button>

    </form>

  </div>
</div>
