<div style="min-height: 80vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #f0f4ff, #e8eaf6); padding: 40px 20px;">

  <div style="background: white; border-radius: 20px; padding: 40px; width: 100%; max-width: 560px; box-shadow: 0 10px 40px rgba(0,0,0,0.08); border-top: 4px solid #6366f1;">

    <!-- Title -->
    <h2 style="text-align: center; font-weight: 700; color: #1e293b; margin-bottom: 30px; font-size: 1.6rem;">
      ✨ Post a New Job
    </h2>

    <form [formGroup]="jobForm" (ngSubmit)="onSubmit()">

      <!-- Job Title -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.9rem;">
          Job Title
        </label>
        <input
          type="text"
          formControlName="title"
          placeholder="Job Title"
          style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.95rem; box-sizing: border-box; transition: 0.3s; outline: none;"
        />
        <small *ngIf="jobForm.controls['title']?.touched && jobForm.controls['title']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 4px; display: block;">
          Title is required
        </small>
      </div>

      <!-- Description -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.9rem;">
          Description
        </label>
        <textarea
          rows="4"
          formControlName="description"
          placeholder="Describe the job requirements, skills needed..."
          style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.95rem; box-sizing: border-box; resize: vertical; min-height: 100px; transition: 0.3s; outline: none;"
        ></textarea>
        <small *ngIf="jobForm.controls['description']?.touched && jobForm.controls['description']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 4px; display: block;">
          Description is required
        </small>
      </div>

      <!-- Budget -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.9rem;">
          💰 Budget ($)
        </label>
        <input
          type="number"
          formControlName="budget"
          placeholder="e.g. 5000"
          style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.95rem; box-sizing: border-box; transition: 0.3s; outline: none;"
        />
        <small *ngIf="jobForm.controls['budget']?.touched && jobForm.controls['budget']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 4px; display: block;">
          Budget must be 0 or greater
        </small>
      </div>

      <!-- Status -->
      <div style="margin-bottom: 20px;">
        <label style="display: block; font-weight: 600; color: #374151; margin-bottom: 6px; font-size: 0.9rem;">
          📋 Status
        </label>
        <select
          formControlName="status"
          style="width: 100%; padding: 14px 16px; border-radius: 12px; border: 2px solid #e5e7eb; background: #f9fafb; font-size: 0.95rem; box-sizing: border-box; cursor: pointer; transition: 0.3s; outline: none;"
        >
          <option value="OPEN">🟢 OPEN</option>
          <option value="CLOSED">🔴 CLOSED</option>
        </select>
        <small *ngIf="jobForm.controls['status']?.touched && jobForm.controls['status']?.invalid"
               style="color: #ef4444; font-size: 0.8rem; margin-top: 4px; display: block;">
          Status is required
        </small>
      </div>

      <!-- Submit Button -->
      <button
        type="submit"
        [disabled]="jobForm.invalid"
        style="width: 100%; padding: 14px; border-radius: 12px; border: none; background: linear-gradient(135deg, #6366f1, #8b5cf6); color: white; font-size: 1rem; font-weight: 700; cursor: pointer; box-shadow: 0 4px 15px rgba(99,102,241,0.3); transition: 0.3s; letter-spacing: 0.5px;"
        [style.opacity]="jobForm.invalid ? '0.5' : '1'"
        [style.cursor]="jobForm.invalid ? 'not-allowed' : 'pointer'"
      >
        🚀 Create Job
      </button>

    </form>

  </div>

</div>
