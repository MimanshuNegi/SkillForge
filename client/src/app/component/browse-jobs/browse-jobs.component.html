<div class="app-wrapper">
  <div class="app-card">

    <h2 class="title">Browse Jobs</h2>

    <div *ngIf="jobs.length === 0" class="empty">No jobs available.</div>

    <div *ngFor="let job of jobs" class="job-card">
      <h4>{{ job.title }}</h4>
      <p>{{ job.description }}</p>
      <p><strong>Budget:</strong> {{ job.budget }}</p>
      <p><strong>Status:</strong> {{ job.status }}</p>
    </div>

  </div>
</div>
